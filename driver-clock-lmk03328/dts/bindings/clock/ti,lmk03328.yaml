description: |
  Texas Instruments LMK03328 I2C clock generator.

  The driver writes a flat list of register settings to the device during
  boot. Each entry in reg-values is a 16-bit encoded word where the most
  significant byte is the register address and the least significant byte
  is the value to write.

  Example DTS node (I2C address 0x5A):

    lmk03328: lmk03328@5a {
        compatible = "ti,lmk03328";
        reg = <0x5a>;
        status = "okay";
        reg-values = <
            0x0010  /* R0  = 0x10 */
            0x010B  /* R1  = 0x0B */
            0x0232  /* R2  = 0x32 */
        >;
    };

compatible: "ti,lmk03328"

include: i2c-device.yaml

properties:
  init-priority:
    type: int
    description: |
      Driver initialization priority. Overrides CONFIG_LMK03328_INIT_PRIORITY
      for this specific device instance. The I2C bus must be ready before this
      driver initializes, so this value must be higher than the I2C controller
      init priority (typically 50).

  software-reset:
    type: boolean
    description: |
      When present, a software reset is issued after all registers have been
      written. The reset is performed by clearing bit 7 of R12 (register
      address 0x0C) via a read-modify-write operation.

  reg-values:
    type: array
    required: true
    description: |
      Register initialization sequence for the LMK03328.

      Each entry is a 16-bit encoded value:
        bits[15:8] - register address (0x00 .. 0xAC)
        bits[7:0]  - register value to write

      The registers are written in the order they appear in the array.
      Values are generated by the TICS Pro configuration tool and exported
      as hex register values (e.g. PS33.33-SZG64.8-HexRegisterValues.txt).
