# General config
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

#shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_I2C_SHELL=y

# GPIO
CONFIG_GPIO=y

# I2C
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_I2C_TCA954X_ROOT_INIT_PRIO=50
CONFIG_I2C_TCA954X_CHANNEL_INIT_PRIO=60

#INA219 sensors on SOC power supply lines
CONFIG_INA219=y

#clock control expander
CONFIG_GPIO_TCA6416A=y

# LMK03328 clock generator
CONFIG_LMK03328=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y



# GPIO shell for bring-up (gpio get/set/conf)
CONFIG_GPIO_SHELL=y
