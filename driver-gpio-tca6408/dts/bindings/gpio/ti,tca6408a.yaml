description: |
  Texas Instruments TCA6408A 8-bit I2C GPIO expander.

  The TCA6408A provides 8 GPIO pins over a single I2C interface.
  It supports an open-drain interrupt output and an active-low hardware
  reset line.

  Example devicetree node:

    &i2c0 {
      tca6408a: gpio@20 {
        compatible = "ti,tca6408a";
        reg = <0x20>;
        gpio-controller;
        #gpio-cells = <2>;
        ngpios = <8>;

        /* optional interrupt line (active-low, open-drain) */
        int-gpios = <&gpio0 4 (GPIO_ACTIVE_LOW | GPIO_PULL_UP)>;

        /* optional hardware reset line (active-low) */
        reset-gpios = <&gpio0 5 GPIO_ACTIVE_LOW>;
      };
    };

  Pin numbering maps directly to the 8 port pins P0–P7.

compatible: "ti,tca6408a"

include:
  - name: base.yaml
  - name: gpio-controller.yaml
  - name: i2c-device.yaml

properties:
  reg:
    required: true
    description: |
      I2C device address. The TCA6408A can be configured for two
      addresses depending on the ADDR pin:
        0x20  (ADDR tied LOW)
        0x21  (ADDR tied HIGH)

  "#gpio-cells":
    const: 2
    description: |
      Two cells are required: <pin flags>.
        pin   – GPIO pin number (0–7).
        flags – GPIO flags (e.g. GPIO_ACTIVE_LOW).

  int-gpios:
    type: phandle-array
    required: false
    description: |
      Phandle and GPIO specifier for the host GPIO connected to the
      active-low, open-drain INT pin of the TCA6408A. When configured,
      input-state changes on the expander will trigger an interrupt on the
      host and the driver will fire the registered GPIO callbacks.

  reset-gpios:
    type: phandle-array
    required: false
    description: |
      Phandle and GPIO specifier for the host GPIO connected to the
      active-low RESET pin of the TCA6408A. When provided the driver
      issues a hardware reset during initialisation. If omitted the
      polarity-inversion register is cleared in software instead.

gpio-cells:
  - pin
  - flags
